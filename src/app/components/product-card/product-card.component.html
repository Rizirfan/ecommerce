<a [routerLink]="['/product', product.id]" class="card">
  <div class="card-image">
    <img [src]="product.image" [alt]="product.name" loading="lazy" />
    @if (product.discount > 0) {
      <span class="discount-badge">-{{ product.discount }}%</span>
    }
    <button class="wishlist-btn" [class.active]="inWishlist" (click)="toggleWishlist($event)" aria-label="Toggle wishlist">
      <svg width="16" height="16" viewBox="0 0 24 24" [attr.fill]="inWishlist ? '#ef4444' : 'none'" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </button>
  </div>
  <div class="card-body">
    <span class="card-category">{{ product.category }}</span>
    <h3 class="card-title">{{ product.name }}</h3>
    <div class="card-rating">
      <span class="stars">{{ stars }}</span>
      <span class="rating-num">{{ product.rating }}</span>
    </div>
    <div class="card-footer">
      <div class="price-group">
        <span class="current-price">₹{{ discountedPrice }}</span>
        @if (product.discount > 0) {
          <span class="original-price">₹{{ product.price }}</span>
        }
      </div>
      <button class="add-btn" (click)="addToCart($event)">Add</button>
    </div>
  </div>
</a>
